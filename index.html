<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國中會考理化與數學・每日十題特訓</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .katex { font-size: 1.1em; }
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .option-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .option-card:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.1);
      border-color: #6366f1;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-brand-100 selection:text-brand-700">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-sm">
          10
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-lg leading-tight tracking-tight">會考特訓營</h1>
          <p class="text-xs text-slate-500 font-medium">每日刷題・錯題攻克</p>
        </div>
      </div>
      <nav class="flex gap-2">
        <button onclick="navigate('home')" class="px-3.5 py-2 rounded-lg text-sm font-semibold transition-colors bg-brand-50 text-brand-700 hover:bg-brand-100">
          儀表板
        </button>
        <button onclick="navigate('bank')" class="px-3.5 py-2 rounded-lg text-sm font-semibold transition-colors text-slate-600 hover:bg-slate-100">
          題庫總覽
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Area -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8">

    <!-- ================= VIEW: HOME (Dashboard) ================= -->
    <section id="view-home" class="fade-in space-y-8">
      
      <!-- Welcome & Stats -->
      <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
        <div class="flex flex-col md:flex-row gap-8 justify-between">
          <div class="max-w-xl space-y-4">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 tracking-wide uppercase">
              <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
              Level Up Everyday
            </div>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">準備好今天的挑戰了嗎？</h2>
            <p class="text-slate-600 text-base leading-relaxed">
              透過隨機抽題與自動錯題本機制，精準打擊理化與數學弱點。完成每日 10 題，穩紮穩打迎戰會考！
            </p>
          </div>
          
          <div class="grid grid-cols-2 gap-4 shrink-0 w-full md:w-auto">
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-col items-center justify-center">
              <span class="text-3xl font-black text-slate-800" id="stat-total-ans">0</span>
              <span class="text-xs font-semibold text-slate-500 mt-1 uppercase tracking-wider">累計答題</span>
            </div>
            <div class="bg-rose-50 border border-rose-100 rounded-2xl p-4 flex flex-col items-center justify-center relative overflow-hidden">
              <span class="text-3xl font-black text-rose-600" id="stat-mistakes">0</span>
              <span class="text-xs font-semibold text-rose-500 mt-1 uppercase tracking-wider">錯題本待復習</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Cards -->
      <div>
        <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          🎯 選擇特訓模式
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
          <!-- Daily Random -->
          <button onclick="startQuiz('mixed')" class="text-left bg-gradient-to-br from-indigo-500 to-brand-600 rounded-3xl p-6 shadow-md hover:shadow-lg transition-all hover:-translate-y-1 relative overflow-hidden group">
            <div class="absolute right-0 top-0 opacity-10 translate-x-1/4 -translate-y-1/4">
              <svg width="120" height="120" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 4l6 14H6l6-14z"/></svg>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-2xl mb-4 shadow-sm">🚀</div>
            <h4 class="font-bold text-white text-xl mb-1">每日綜合十題</h4>
            <p class="text-indigo-100 text-sm font-medium mb-6">物理與數學混合，模擬實戰手感</p>
            <div class="inline-flex items-center text-xs font-bold bg-white/20 text-white px-3 py-1.5 rounded-full group-hover:bg-white group-hover:text-brand-600 transition-colors">
              立即開始 &rarr;
            </div>
          </button>

          <!-- Mistakes -->
          <button onclick="startQuiz('mistakes')" class="text-left bg-white border-2 border-rose-200 hover:border-rose-400 rounded-3xl p-6 shadow-sm hover:shadow-md transition-all group">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 flex items-center justify-center text-2xl mb-4">📓</div>
            <h4 class="font-bold text-slate-900 text-xl mb-1 group-hover:text-rose-600 transition-colors">錯題本重練</h4>
            <p class="text-slate-500 text-sm font-medium mb-6">針對答錯題型反覆練習直到精熟</p>
            <div class="inline-flex items-center text-xs font-bold bg-rose-50 text-rose-600 px-3 py-1.5 rounded-full">
              重練 <span id="btn-wrong-count" class="mx-1">0</span> 題 &rarr;
            </div>
          </button>

          <!-- Subject Specific -->
          <div class="flex flex-col gap-4">
            <button onclick="startQuiz('physics')" class="flex-1 text-left bg-white border border-slate-200 hover:border-sky-400 rounded-2xl p-5 shadow-sm hover:shadow-md transition-all flex items-center gap-4 group">
              <div class="w-10 h-10 rounded-xl bg-sky-100 flex items-center justify-center text-xl shrink-0">⚡</div>
              <div>
                <h4 class="font-bold text-slate-900 group-hover:text-sky-600 transition-colors">專攻理化</h4>
                <p class="text-xs font-medium text-slate-500 mt-0.5">電路、力學、運動</p>
              </div>
            </button>
            <button onclick="startQuiz('math')" class="flex-1 text-left bg-white border border-slate-200 hover:border-amber-400 rounded-2xl p-5 shadow-sm hover:shadow-md transition-all flex items-center gap-4 group">
              <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center text-xl shrink-0">📐</div>
              <div>
                <h4 class="font-bold text-slate-900 group-hover:text-amber-600 transition-colors">專攻數學</h4>
                <p class="text-xs font-medium text-slate-500 mt-0.5">幾何、函數、證明</p>
              </div>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= VIEW: QUIZ ENGINE ================= -->
    <section id="view-quiz" class="hidden fade-in max-w-2xl mx-auto">
      
      <!-- Progress Header -->
      <div class="flex items-center justify-between mb-6">
        <button onclick="navigate('home')" class="text-slate-400 hover:text-slate-800 font-semibold text-sm flex items-center gap-1 transition-colors">
          &larr; 放棄退出
        </button>
        <div class="bg-white px-4 py-1.5 rounded-full shadow-sm border border-slate-200 flex items-center gap-2">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest" id="quiz-mode-tag">MIXED</span>
          <div class="w-px h-3 bg-slate-300"></div>
          <span class="font-black text-brand-600" id="q-curr">1</span>
          <span class="text-slate-400 font-bold text-sm">/ <span id="q-tot">10</span></span>
        </div>
      </div>

      <!-- Question Box -->
      <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden mb-6 relative">
        <div class="h-1.5 w-full bg-slate-100">
          <div id="quiz-progress-bar" class="h-full bg-brand-500 transition-all duration-300 w-0"></div>
        </div>
        
        <div class="p-6 sm:p-8">
          <div class="flex gap-2 mb-4">
            <span id="badge-subj" class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 text-slate-600">科目</span>
            <span id="badge-topic" class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 text-slate-600">單元</span>
          </div>

          <div id="q-content" class="text-lg font-medium text-slate-900 leading-relaxed mb-6">
            <!-- Question text -->
          </div>

          <div id="q-svg-container" class="hidden mb-8 p-4 bg-slate-50/50 rounded-2xl border border-slate-200 flex justify-center items-center">
            <div id="q-svg-box" class="w-full max-w-sm"></div>
          </div>

          <div id="q-options-container" class="space-y-3">
            <!-- Options injected here -->
          </div>
        </div>
      </div>

      <!-- Feedback / Explanation -->
      <div id="feedback-panel" class="hidden fade-in bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
        <div class="flex items-start gap-4 mb-5">
          <div id="fb-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-white font-black text-xl shrink-0"></div>
          <div>
            <h3 id="fb-title" class="text-xl font-bold"></h3>
            <p id="fb-subtitle" class="text-sm font-medium mt-1"></p>
          </div>
        </div>
        
        <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 text-sm text-slate-700 leading-relaxed">
          <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">解題思路</div>
          <div id="fb-explanation"></div>
        </div>

        <button onclick="nextQuestion()" class="mt-6 w-full py-3.5 rounded-xl bg-slate-900 hover:bg-brand-600 text-white font-bold text-lg shadow-md transition-colors flex items-center justify-center gap-2">
          <span id="btn-next-text">下一題</span> &rarr;
        </button>
      </div>

    </section>

    <!-- ================= VIEW: RESULT SUMMARY ================= -->
    <section id="view-result" class="hidden fade-in max-w-xl mx-auto text-center space-y-6 pt-8">
      <div class="text-6xl mb-4" id="res-emoji">🏆</div>
      <h2 class="text-3xl font-extrabold text-slate-900">測驗完成！</h2>
      <p class="text-slate-500 font-medium" id="res-msg">持續練習，離A++更進一步！</p>
      
      <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 flex justify-center gap-12 my-8">
        <div>
          <div class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-1">答對</div>
          <div class="text-4xl font-black text-emerald-500" id="res-correct">0</div>
        </div>
        <div class="w-px bg-slate-200"></div>
        <div>
          <div class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-1">錯題</div>
          <div class="text-4xl font-black text-rose-500" id="res-wrong">0</div>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <button onclick="navigate('home')" class="w-full py-4 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-lg shadow-md transition-colors">
          回首頁查看進度
        </button>
      </div>
    </section>

    <!-- ================= VIEW: BANK (Browse) ================= -->
    <section id="view-bank" class="hidden fade-in space-y-6">
      <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold text-slate-900">題庫總覽</h2>
          <p class="text-sm text-slate-500 font-medium mt-1">完整收錄 <span id="bank-total" class="font-bold text-brand-600">0</span> 題經典考題與詳解</p>
        </div>
        <select id="bank-filter" onchange="renderBank()" class="px-4 py-2.5 rounded-xl border-2 border-slate-200 bg-slate-50 font-semibold text-sm text-slate-700 outline-none focus:border-brand-500 transition-colors cursor-pointer">
          <option value="all">顯示全部題目</option>
          <option value="physics">僅顯示 理化</option>
          <option value="math">僅顯示 數學</option>
          <option value="wrong">⚠️ 僅顯示 錯題本</option>
        </select>
      </div>

      <div id="bank-list" class="grid grid-cols-1 gap-6">
        <!-- Rendered items -->
      </div>
    </section>

  </main>

        exp: '重心將面積三等分（$\\triangle GAB = \\triangle GAC = \\triangle GBC$）。<br>圓 $G$ 切 $\\overline{AB},\\overline{AC} \\Rightarrow$ 高相等 $\\Rightarrow \\overline{AB}=\\overline{AC}$。<br>交 $\\overline{BC}$ 於兩點 $\\Rightarrow$ 到 $\\overline{BC}$ 的高較短。因面積相同，高較短者底邊較長，故 $\\overline{BC}$ 最長。'
      },
      {
        id: 'M13', subj: '數學', topic: '外心位置',
        q: '坐標平面上 $\\triangle ABC$ 頂點為 $A(0, -5)$、$B(-4, 0)$、$C(8, 0)$。若 $\\angle BAC = 100^\\circ$，則外心落在第幾象限？',
        opts: ['第一象限', '第二象限', '第三象限', '第四象限'],
        ans: 0,
        exp: '鈍角三角形外心在三角形外部，且位於鈍角對邊（$\\overline{BC}$，即 $x$ 軸）的另一側（$y>0$）。<br>$\\overline{BC}$ 中垂線為 $x = 2$。外心 $(2, y)$ 在第一象限。'
      },
      {
        id: 'M14', subj: '數學', topic: '圓周角',
        q: '圓通過 $\\triangle ABC$ 的三個頂點，且 $\\overline{BC}$ 的中垂線與弧 $\\overset{\\frown}{AC}$ 交於 $D$。若 $\\angle B = 80^\\circ, \\angle C = 40^\\circ$，則弧 $\\overset{\\frown}{AD}$ 度數為何？',
        opts: ['$20^\\circ$', '$30^\\circ$', '$40^\\circ$', '$50^\\circ$'],
        ans: 2,
        exp: '$\\angle A = 60^\\circ \\Rightarrow$ 優弧 $\\overset{\\frown}{BAC} = 240^\\circ$。<br>中垂線平分優弧 $\\Rightarrow \\overset{\\frown}{BD} = 120^\\circ$。<br>$\\overset{\\frown}{AB} = 2\\angle C = 80^\\circ$。<br>$\\overset{\\frown}{AD} = \\overset{\\frown}{BD} - \\overset{\\frown}{AB} = 40^\\circ$。'
      }
    ];

    // =========================================================================
    // STATE MANAGEMENT
    // =========================================================================
    let state = { mistakes: [] };
    let session = { qList: [], curIdx: 0, results: [] };

    function loadState() {
      const saved = localStorage.getItem('cap_quiz_state');
      if (saved) state = JSON.parse(saved);
      updateDashboard();
    }
    
    function saveState() {
      localStorage.setItem('cap_quiz_state', JSON.stringify(state));
      updateDashboard();
    }

    function updateDashboard() {
      document.getElementById('stat-mistakes').textContent = state.mistakes.length;
      document.getElementById('btn-wrong-count').textContent = state.mistakes.length;
      document.getElementById('bank-total').textContent = qBank.length;
      // Mock stat for total ans
      const totalAns = parseInt(localStorage.getItem('cap_total_ans') || '0');
      document.getElementById('stat-total-ans').textContent = totalAns;
    }

    function navigate(view) {
      ['home', 'quiz', 'result', 'bank'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
      });
      document.getElementById(`view-${view}`).classList.remove('hidden');
      window.scrollTo({ top: 0 });
      if(view === 'bank') renderBank();
      if(view === 'home') updateDashboard();
    }

    // =========================================================================
    // QUIZ LOGIC
    // =========================================================================
    function shuffle(arr) {
      let m = arr.length, t, i;
      while (m) {
        i = Math.floor(Math.random() * m--);
        t = arr[m]; arr[m] = arr[i]; arr[i] = t;
      }
      return arr;
    }

    function startQuiz(mode) {
      let pool = [];
      let modeStr = '';
      
      if (mode === 'mixed') {
        pool = [...qBank];
        modeStr = '綜合十題';
      } else if (mode === 'physics') {
        pool = qBank.filter(q => q.subj === '物理');
        modeStr = '理化特訓';
      } else if (mode === 'math') {
        pool = qBank.filter(q => q.subj === '數學');
        modeStr = '數學特訓';
      } else if (mode === 'mistakes') {
        pool = qBank.filter(q => state.mistakes.includes(q.id));
        modeStr = '錯題重練';
        if (pool.length === 0) return alert('目前錯題本是空的！太棒了！');
      }

      session = {
        qList: shuffle(pool).slice(0, 10),
        curIdx: 0,
        results: [],
        modeStr
      };

      document.getElementById('quiz-mode-tag').textContent = modeStr;
      document.getElementById('q-tot').textContent = session.qList.length;
      
      navigate('quiz');
      renderQuestion();
    }

    function renderQuestion() {
      const q = session.qList[session.curIdx];
      const tot = session.qList.length;
      
      // Progress
      document.getElementById('q-curr').textContent = session.curIdx + 1;
      document.getElementById('quiz-progress-bar').style.width = `${((session.curIdx) / tot) * 100}%`;
      
      // Badges & text
      document.getElementById('badge-subj').textContent = q.subj;
      document.getElementById('badge-subj').className = q.subj === '物理' 
        ? 'px-2.5 py-1 rounded-md text-xs font-bold bg-indigo-100 text-indigo-700'
        : 'px-2.5 py-1 rounded-md text-xs font-bold bg-amber-100 text-amber-800';
      document.getElementById('badge-topic').textContent = q.topic;
      document.getElementById('q-content').innerHTML = q.q;

      // SVG
      const svgBox = document.getElementById('q-svg-container');
      if (q.svg && SVGS[q.svg]) {
        document.getElementById('q-svg-box').innerHTML = SVGS[q.svg];
        svgBox.classList.remove('hidden');
      } else {
        svgBox.classList.add('hidden');
      }

      // Options
      const letters = ['A', 'B', 'C', 'D'];
      const optHtml = q.opts.map((opt, i) => `
        <button id="opt-${i}" onclick="submitAnswer(${i})" class="option-card w-full text-left p-4 rounded-2xl border-2 border-slate-100 bg-white flex items-center gap-4 group">
          <span id="opt-letter-${i}" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 font-black flex items-center justify-center shrink-0 border border-slate-200 group-hover:bg-brand-500 group-hover:text-white group-hover:border-brand-500 transition-all">
            ${letters[i]}
          </span>
          <span class="font-medium text-slate-700 group-hover:text-brand-900">${opt}</span>
        </button>
      `).join('');
      document.getElementById('q-options-container').innerHTML = optHtml;

      document.getElementById('feedback-panel').classList.add('hidden');
      renderMathInElement(document.getElementById('view-quiz'), { throwOnError: false, delimiters: [{left: "$", right: "$", display: false}] });
    }

    function submitAnswer(selIdx) {
      // Prevent multiple clicks
      if (document.getElementById('feedback-panel').classList.contains('hidden') === false) return;

      const q = session.qList[session.curIdx];
      const isCorrect = (selIdx === q.ans);
      
      // Save stats
      let totalAns = parseInt(localStorage.getItem('cap_total_ans') || '0');
      localStorage.setItem('cap_total_ans', totalAns + 1);

      if (isCorrect) {
        state.mistakes = state.mistakes.filter(id => id !== q.id);
      } else {
        if (!state.mistakes.includes(q.id)) state.mistakes.push(q.id);
      }
      saveState();
      
      session.results.push(isCorrect);

      // Style options
      q.opts.forEach((_, i) => {
        const btn = document.getElementById(`opt-${i}`);
        const letter = document.getElementById(`opt-letter-${i}`);
        btn.disabled = true;
        btn.classList.remove('hover:-translate-y-1', 'group');
        
        if (i === q.ans) {
          btn.className = 'w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 flex items-center gap-4';
          letter.className = 'w-10 h-10 rounded-xl bg-emerald-500 text-white font-black flex items-center justify-center shrink-0 shadow-sm';
        } else if (i === selIdx && !isCorrect) {
          btn.className = 'w-full text-left p-4 rounded-2xl border-2 border-rose-400 bg-rose-50 flex items-center gap-4';
          letter.className = 'w-10 h-10 rounded-xl bg-rose-500 text-white font-black flex items-center justify-center shrink-0 shadow-sm';
        } else {
          btn.style.opacity = '0.5';
        }
      });

      // Feedback
      const icon = document.getElementById('fb-icon');
      if (isCorrect) {
        icon.textContent = '✓';
        icon.className = 'w-10 h-10 rounded-full flex items-center justify-center text-white font-black text-xl shrink-0 bg-emerald-500 shadow-sm shadow-emerald-200';
        document.getElementById('fb-title').innerHTML = '<span class="text-emerald-600">完全正確！</span>';
        document.getElementById('fb-subtitle').textContent = '觀念非常清楚，繼續保持！';
      } else {
        icon.textContent = '✕';
        icon.className = 'w-10 h-10 rounded-full flex items-center justify-center text-white font-black text-xl shrink-0 bg-rose-500 shadow-sm shadow-rose-200';
        document.getElementById('fb-title').innerHTML = '<span class="text-rose-600">答錯了，已收錄至錯題本</span>';
        document.getElementById('fb-subtitle').textContent = `正確答案是 (${['A','B','C','D'][q.ans]})`;
      }
      
      document.getElementById('fb-explanation').innerHTML = q.exp;
      document.getElementById('btn-next-text').textContent = (session.curIdx + 1 === session.qList.length) ? '查看測驗結果' : '下一題';
      
      document.getElementById('feedback-panel').classList.remove('hidden');
      renderMathInElement(document.getElementById('fb-explanation'), { throwOnError: false, delimiters: [{left: "$", right: "$", display: false}] });
    }

    function nextQuestion() {
      session.curIdx++;
      if (session.curIdx < session.qList.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const correct = session.results.filter(x => x).length;
      document.getElementById('res-correct').textContent = correct;
      document.getElementById('res-wrong').textContent = session.qList.length - correct;
      
      if (correct === session.qList.length) {
        document.getElementById('res-emoji').textContent = '💯';
        document.getElementById('res-msg').textContent = '太強了！全部答對，完美過關！';
      } else {
        document.getElementById('res-emoji').textContent = '💪';
        document.getElementById('res-msg').textContent = '錯題已經幫你存進錯題本，記得再去複習喔！';
      }
      
      navigate('result');
    }

    // =========================================================================
    // BANK VIEW
    // =========================================================================
    function renderBank() {
      const filter = document.getElementById('bank-filter').value;
      const list = document.getElementById('bank-list');
      
      let html = '';
      qBank.forEach((q, i) => {
        if (filter === 'physics' && q.subj !== '物理') return;
        if (filter === 'math' && q.subj !== '數學') return;
        if (filter === 'wrong' && !state.mistakes.includes(q.id)) return;

        const isWrong = state.mistakes.includes(q.id);
        const subjCls = q.subj === '物理' ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-800';
        const letters = ['A','B','C','D'];
        
        html += `
          <div class="bg-white rounded-3xl p-6 border ${isWrong ? 'border-rose-200 bg-rose-50/20' : 'border-slate-200'}">
            <div class="flex gap-2 mb-4">
              <span class="px-2.5 py-1 rounded text-xs font-bold ${subjCls}">${q.subj}</span>
              <span class="px-2.5 py-1 rounded text-xs font-bold bg-slate-100 text-slate-600">${q.topic}</span>
              ${isWrong ? `<span class="px-2.5 py-1 rounded text-xs font-bold bg-rose-100 text-rose-600 ml-auto flex items-center gap-1">⚠️ 錯題</span>` : ''}
            </div>
            <div class="font-medium text-slate-900 leading-relaxed mb-4">${q.q}</div>
            ${q.svg && SVGS[q.svg] ? `<div class="mb-4 p-4 bg-slate-50 rounded-2xl max-w-sm border border-slate-200 mx-auto">${SVGS[q.svg]}</div>` : ''}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
              ${q.opts.map((opt, idx) => `
                <div class="p-3 rounded-xl text-sm border ${idx === q.ans ? 'border-emerald-500 bg-emerald-50 font-bold text-emerald-800' : 'border-slate-100 text-slate-500'}">
                  (${letters[idx]}) ${opt}
                </div>
              `).join('')}
            </div>
            <details class="bg-slate-50 rounded-xl border border-slate-200 overflow-hidden">
              <summary class="p-4 text-sm font-bold text-brand-600 cursor-pointer select-none bg-slate-100/50">查看詳細解析</summary>
              <div class="p-4 pt-2 text-sm text-slate-700 leading-relaxed border-t border-slate-200">
                ${q.exp}
              </div>
            </details>
          </div>
        `;
      });
      list.innerHTML = html || `<div class="text-center py-12 text-slate-400 font-bold text-lg">沒有找到符合條件的題目 🤔</div>`;
      renderMathInElement(list, { throwOnError: false, delimiters: [{left: "$", right: "$", display: false}] });
    }

    // Init
    window.onload = loadState;
  </script>
</body>
</html>
